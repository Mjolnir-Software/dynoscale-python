name: dynoscale-node

on:
  push:
    paths:
      - "dynoscale-node/**"
      - ".github/workflows/dynoscale-node.yml"
  pull_request:
    paths:
      - "dynoscale-node/**"
      - ".github/workflows/dynoscale-node.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    defaults:
      run:
        working-directory: dynoscale-node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
